<!DOCTYPE html>
<html>

<head>
    <title>Cube Banner Ad By adxbird</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="ad.size" content="width=300,height=250" />
    <link rel="stylesheet" type="text/css" href="style.css">

    <style>
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .adx_wrapper {
            animation: scaleIn 0.6s ease-out forwards;
        }

        @media (max-width: 299px) {
            body {
                overflow: hidden;
                transform: scale(.9, .9);
                margin: 0;
                padding: 0;
                text-align: center;
                transform-origin: top left;
            }
        }


        @media (max-width: 250px) {
            body {
                overflow: hidden;
                transform: scale(.79, .79);
                margin: 0;
                padding: 0;
                text-align: center;
                transform-origin: top left;
            }
        }

        /* --- Updated & Fixed Logo Styles --- */
        .adx_logo_area {
            background: #d0141433;
            border-radius: 50%;          /* Perfect circle initially */
            position: absolute;
            bottom: 3px;
            right: 3px;
            height: 15px;
            width: 15px;                 /* Starts as a 20px x 20px circle */
            overflow: hidden;
            
            /* Pin the transition anchor to the right so it grows leftward */
            transform-origin: right center; 
            
            /* Clean, fallback-safe CSS properties */
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-radius 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 6000;
        }

        /* Hover State */
        .adx_logo_area:hover {
            width: 40px;                 /* Expands wide enough to show full text */
            border-radius: 4px;          /* Becomes a clean rounded rectangle */
        }

        /* This inner container holds the image static so it never moves or squishes */
        .adx_logo_window {
            position: absolute;
            top: 0;
            left: 0;
            width: 65px;                 /* Matches the max expanded width */
            height: 100%;
        }

        .adx_logo {
            position: absolute;
            top: 50%;
            left: 3px;                   /* Keeps the "D" side perfectly locked here */
            height: 75%;
            width: auto;                 /* Prevents image distortion */
            transform: translateY(-50%);
            pointer-events: none;
        }
        
    </style>    
</head>

<body>
    <div class="adx_wrapper">
        <div id="adArea" class="rct" style="opacity: 0; visibility: hidden; margin: auto;left: 0;right: 0;width: 300px;height: 250px;">
            <div id="curso" class="mouse ffx zIndex5000">
                <img src="images/swipe.png" style="width: 60px; height: 60px;position: absolute;top: 90%;left: 50%;transform: translateX(-50%);">
            </div>
            <div class="wrap noEvents zIndex3000">
                <div id="c1" class="cube">
                    <div class="pic1 rct face ff2 "></div>
                    <div class="pic4 rct face ff1"></div>
                    <div class="pic3 rct face ff3"></div>
                    <div class="pic2 rct face ff4"></div>

                </div>
            </div>
            <div class="wrap noEvents zIndex2400">
                <div id="c2" class="cube">
                    <div id="shadow" class="rct face f7 noVis"></div>
                </div>

            </div>
            <div id="dragArea" class="rct zIndex5000"></div>
        </div>
        
  
    </div>
    <script type="text/javascript" src="TweenMax.min.js"></script>
    <script type="text/javascript" src="Draggable.min.js"></script>
    <script>
        var assets_url = "images/";
        var assets = {
            init: [{
                format: "png",
                type: "class",
                scale: 1,
                names: "pic1 pic2 pic3 pic4"
            },
            {
                format: "png",
                type: "id",
                scale: 1,
                names: "shadow"
            },],
        };
    </script>
    <script src="code.min.js"></script>

</body>

</html>
