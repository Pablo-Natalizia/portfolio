<!DOCTYPE html>
<html lang="en">
<head>
    <title>index</title>
    <meta charset="UTF-8">
    <meta name="authoring-tool" content="Adobe_Animate_CC">
    <meta name="ad.size" content="width=300,height=250">
    <script type="text/javascript">
        var clickTag = "";
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-size: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: rgba(255, 255, 255, 1.00);
        }
        #animation_container {
            position: relative;
            width: 300px;
            height: 250px;
            background-color: rgba(255, 255, 255, 1.00);
            overflow: hidden;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        #click_area {
            position: absolute;
            left: 0;
            top: 0;
            width: 300px;
            height: 250px;
            z-index: 10;
            cursor: pointer;
            text-decoration: none;
            background: transparent;
        }
        #dom_overlay_container {
            pointer-events: none;
            overflow: hidden;
            width: 300px;
            height: 250px;
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            z-index: 2;
        }
        #canvas {
            position: absolute;
            display: block;
            background-color: rgba(255, 255, 255, 1.00);
            z-index: 1;
        }
        #_preload_div_ {
            box-sizing: border-box;
        }
    </style>
    <script src="https://s0.2mdn.net/ads/studio/cached_libs/createjs_2019.11.15_min.js"></script>
    <script src="index.js"></script>
    <script>
    var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
    function init() {
        canvas = document.getElementById("canvas");
        anim_container = document.getElementById("animation_container");
        dom_overlay_container = document.getElementById("dom_overlay_container");
        var clickArea = document.getElementById("click_area");
        if (clickArea) {
            clickArea.addEventListener("click", function () {
                if (clickTag) {
                    window.open(clickTag, "_blank");
                }
            });
        }
	var comp=AdobeAn.getComposition("A4DAFDFBAF18B64E9CD2D6DEB02E1B51");
	var lib=comp.getLibrary();
	var loader = new createjs.LoadQueue(false);
	loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
	loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
	var lib=comp.getLibrary();
	loader.loadManifest(lib.properties.manifest);
    }
function handleFileLoad(evt, comp) {
	var images=comp.getImages();
	if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }
}
function handleComplete(evt,comp) {
	var lib=comp.getLibrary();
	var ss=comp.getSpriteSheet();
	var queue = evt.target;
	var ssMetadata = lib.ssMetadata;
	for(i=0; i<ssMetadata.length; i++) {
		ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
	}
	exportRoot = new lib._300x250();
	stage = new lib.Stage(canvas);
        fnStartAnimation = function() {
		stage.addChild(exportRoot);
		createjs.Ticker.framerate = lib.properties.fps;
		createjs.Ticker.addEventListener("tick", stage);
	}
	AdobeAn.makeResponsive(false,'both',false,1,[canvas,anim_container,dom_overlay_container]);
	AdobeAn.compositionLoaded(lib.properties.id);
	fnStartAnimation();
}
    </script>
</head>
<body onload="init();">
    <div id="animation_container">
        <div id="click_area"></div>
        <canvas
            id="canvas"
            width="300"
            height="250"
            style="position:absolute; left:0; top:0;">
        </canvas>
        <div id="dom_overlay_container"></div>
    </div>
    <script>
        var banner = document.getElementById("animation_container");
        if (banner) {
            banner.addEventListener("mouseover", rollOver, false);
            banner.addEventListener("mouseout", rollOut, false);
        }
        function rollOver() {
            if (typeof window.eventoRollOver === "function") {
                window.eventoRollOver();
            }
        }
        function rollOut() {
            if (typeof window.eventoRollOut === "function") {
                window.eventoRollOut();
            }
        }
    </script>
</body>
</html>
