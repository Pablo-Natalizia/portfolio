/* ===== V11 — subtle animated night-sky gallery ===== */
body{
  background:#0b1220 !important;
}

main{
  position:relative;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 18%, rgba(37,99,235,.16), transparent 28rem),
    radial-gradient(circle at 82% 55%, rgba(59,130,246,.09), transparent 34rem),
    linear-gradient(180deg,#101827 0%,#0b1220 48%,#0d1524 100%) !important;
}

/* Soft moving atmospheric glow */
main::before{
  content:"";
  position:absolute;
  z-index:-2;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(96,165,250,.10), transparent 30%),
    radial-gradient(ellipse at 75% 65%, rgba(37,99,235,.08), transparent 32%);
  background-size:140% 140%;
  animation:ambientDrift 18s ease-in-out infinite alternate;
}

/* Very subtle moving diagonal lines */
main::after{
  content:"";
  position:absolute;
  z-index:-1;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    repeating-linear-gradient(
      115deg,
      transparent 0,
      transparent 88px,
      rgba(148,163,184,.10) 89px,
      transparent 90px,
      transparent 176px
    );
  background-size:420px 420px;
  animation:lineDrift 26s linear infinite;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 8%,#000 92%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 8%,#000 92%,transparent 100%);
}

@keyframes ambientDrift{
  0%{ background-position:0% 0%,100% 100%; }
  100%{ background-position:12% 8%,88% 90%; }
}

@keyframes lineDrift{
  from{ background-position:0 0; }
  to{ background-position:420px 180px; }
}

/* Section titles adapted to dark background */
.category-header h2{
  color:#dce5f2 !important;
}

.category-header::before{
  background:rgba(148,163,184,.18) !important;
}

/* Slightly lift banners from the dark canvas */
.banner-wrapper{
  box-shadow:0 12px 32px rgba(0,0,0,.24) !important;
}

.banner-wrapper:hover{
  box-shadow:0 22px 48px rgba(0,0,0,.34) !important;
}

/* Respect reduced-motion preferences */
@media(prefers-reduced-motion:reduce){
  main::before,
  main::after{
    animation:none !important;
  }
}

/* The previous dark background lived only on <main>, which is a centered

body{
  position:relative;
  background:#09111f !important;
}

main.container{
  position:relative;
  z-index:1;
  background:transparent !important;
}

/* Full-width animated backdrop behind the gallery */
body::before{
  content:"";
  position:fixed;
  z-index:-2;
  inset:0;
  pointer-events:none;
  background:

  background-size:120% 120%,130% 130%,125% 125%,100% 100%;
  animation:skyFlow 16s ease-in-out infinite alternate;
}

/* Animated light trails across the entire viewport */
body::after{
  content:"";
  position:fixed;
  z-index:-1;
  inset:-25%;
  pointer-events:none;
  opacity:.30;
  background:
    linear-gradient(115deg,

    );

}

}

<script>
  const bannerGroups = [
    { nombre: "Medium Rectangles (300x250)", banners: Array.from({length: 8}, (_, i) => ({ ruta: `banners/300x250-0${i+1}/index.html`, ancho: 300, alto: 250 })) },
    { nombre: "Leaderboards (728x90)", banners: Array.from({length: 6}, (_, i) => ({ ruta: `banners/728x90-0${i+1}/index.html`, ancho: 728, alto: 90 })) },
    { nombre: "Half Page (300x600)", banners: Array.from({length: 8}, (_, i) => ({ ruta: `banners/300x600-0${i+1}/index.html`, ancho: 300, alto: 600 })) },
    { nombre: "Wide Skyscrapers (160x600)", banners: Array.from({length: 4}, (_, i) => ({ ruta: `banners/160x600-0${i+1}/index.html`, ancho: 160, alto: 600 })) },
    { nombre: "Mobile Banners (320x50)", banners: Array.from({length: 6}, (_, i) => ({ ruta: `banners/320x50-0${i+1}/index.html`, ancho: 320, alto: 50 })) }
  ];

function hideLoader(id) {
  const iframe = document.getElementById(id);
  const loader = document.getElementById("loader-" + id);
  
  // Verificamos que el src no sea about:blank antes de ocultar
  if (iframe && iframe.src !== "about:blank" && iframe.src !== "" && loader) {
    loader.style.opacity = "0";
    setTimeout(() => { 
      loader.style.display = "none"; 
    }, 300);
    iframe.style.opacity = "1";
  }
}
    
    function reloadBanner(id) {
  const iframe = document.getElementById(id);
  const loader = document.getElementById("loader-" + id);

  if (iframe) {
    // 1. Mostramos el loader de nuevo
    if (loader) {
      loader.style.display = "flex";
      loader.style.opacity = "1";
    }
    
    // 2. Ocultamos el iframe momentáneamente para el efecto visual
    iframe.style.opacity = "0";

    // 3. Forzamos la recarga del contenido
    const currentSrc = iframe.dataset.src;
    iframe.src = "about:blank"; // Limpiamos primero
    
    setTimeout(() => {
      iframe.src = currentSrc; // Volvemos a cargar la ruta real
    }, 50);
  }
}
    


function renderGallery() {
  const container = document.getElementById("gallery-container");
  
const observer = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      const iframe = entry.target;
      const loader = document.getElementById("loader-" + iframe.id);

      if (entry.isIntersecting) {
        // Solo cargamos si está en "about:blank"
        if (iframe.src.includes("about:blank") || iframe.src === "") {
          // Pequeño delay para no saturar el hilo principal al hacer scroll rápido
          if (loader) loader.style.display = "flex";
          iframe.src = iframe.dataset.src;
        }
      } else {
        // Al salir, limpiamos. 
        // TIP: Si el banner es muy pesado, podrias dejar pasar 1 o 2 segundos antes de limpiar
        // para que si el usuario sube y baja rápido, no se reinicie la animación desde cero.
        if (iframe.src !== "about:blank") {
          iframe.src = "about:blank";
          iframe.style.opacity = "0";
          if (loader) {
            loader.style.display = "flex";
            loader.style.opacity = "1";
          }
        }
      }
    });
  },
  { 
    // Aumentamos el margen superior e inferior para precargar los banners
    // antes de que el usuario los vea.
    rootMargin: "180px 0px 180px 0px", 
    threshold: 0 
  }
);

  bannerGroups.forEach((group, gi) => {
    // ... (Tu creación de secciones permanece igual)
const section = document.createElement("section");
    // Añadimos ID a la sección para el scroll
    section.id = `section-group-${gi}`; 
    section.innerHTML = `
      <div class="category-header">
        <div class="category-line"></div>
        <h2>${group.nombre}</h2>
        <div class="category-line"></div>
      </div>
      <div id="group-${gi}" class="flex flex-wrap gap-10 justify-center"></div>
    `;
    container.appendChild(section);

    const grid = section.querySelector(`#group-${gi}`);

    group.banners.forEach((banner, bi) => {
      const id = `iframe-${gi}-${bi}`;
      const wrapper = document.createElement("div");
      wrapper.className = "banner-wrapper";
      wrapper.style.width = banner.ancho + "px";
      wrapper.style.height = banner.alto + "px";

      wrapper.innerHTML = `
        <div id="loader-${id}" class="loader-container" style="transition: opacity 0.3s ease;">
          <span class="loader"></span>
        </div>
        <button class="reload-btn" onclick="reloadBanner('${id}')">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <iframe
          id="${id}"
          data-src="${banner.ruta}"
          src="about:blank"
          width="${banner.ancho}"
          height="${banner.alto}"
          style="opacity: 0; transition: opacity 0.5s ease; background-color: #ffffff;"
          frameborder="0"
          scrolling="no"
          sandbox="allow-scripts allow-same-origin"
          onload="hideLoader('${id}'); disableBannerClicks(this);">
        </iframe>
      `;

      grid.appendChild(wrapper);
      observer.observe(wrapper.querySelector("iframe"));
    });
  });
}

  document.addEventListener("DOMContentLoaded", renderGallery);
    
// Modern filter chips
document.addEventListener("DOMContentLoaded", () => {
  document.body.classList.add("all-filter");
  document.querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      const filter = chip.dataset.filter;

      document.body.classList.toggle("single-filter", filter !== "all");
      document.body.classList.toggle("all-filter", filter === "all");

      bannerGroups.forEach((_, i) => {
        const section = document.getElementById(`section-group-${i}`);
        if (section) section.style.display = (filter === "all" || filter === String(i)) ? "block" : "none";
      });
      const target = filter === "all" ? document.getElementById("gallery-container") : document.getElementById(`section-group-${filter}`);
      if (target) window.scrollTo({top: target.getBoundingClientRect().top + window.pageYOffset - 90, behavior:"smooth"});
    });
  });
});
